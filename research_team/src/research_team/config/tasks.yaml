research_task:
  description: >
    Conduct thorough research about {topic}.
    Make sure you find any interesting and relevant information given
    the current year is {current_year}.
  expected_output: >
    A list with 5 bullet points of the most relevant information about {topic}
  agent: researcher

reporting_task:
  description: >
    Review the context you got and expand each topic into a full section for a report.
    Make sure the report is detailed and contains any and all relevant information.
    Do not add opinions, reasoning, or inferred content. 
    Simply organize and restate the data in the specified format.
    Provide source references at the end of the report in a format that could align with a bibtex file.
  expected_output: >
    A fully fledged report with the main topics, each with a full section of information and the source references at the end.
    The sections must properly cite the source references using the \cite{}.
    Formatted as latex without any extra formatting like markdown.
    # Make sure to split up the LaTeX into tex and bib files.
  agent: reporting_analyst

splitter_task:
  description: >
    Split the report into a list of sections, each with its own title and content.
    Make sure to include any source references at the end of the report in a format that could align with a bibtex file.
  expected_output: >
    A list of sections with their respective titles and contents
  agent: latex_expert

verifier_task:
  description: >
    Review the context you got and break it up into the necessary tex and bib files.
    Verify the LaTeX code is correct and can be compiled.
  expected_output: >
    A confirmation that the LaTeX code is correct and can be compiled
  agent: latex_verifier